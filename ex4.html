<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabalho de Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    <body class="d-flex justify-content-center p-3">
        <form class="col-sm-8">
            <p class="fs-1">Novo usuário</p>
            <div class="">
                <div class="mb-3">
                    <div class="row g-3">
                        <div class="col">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" placeholder="Informe o nome" aria-label="lastname" aria-describedby="basic-addon1">
                        </div>
                    </div>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-sm-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control" placeholder="Informe o cpf" aria-label="City">
                    </div>
                    <div class="col-sm-7">
                        <label for="endereco" class="form-label">Endereço</label>
                        <input type="text" class="form-control" placeholder="Informe o endereço" aria-label="Zip">
                    </div>
                    <div class="col-sm-2">
                        <label for="nivel" class="form-label">Nível</label>
                        <select class="form-select" id="inputGroupSelect01">
                            <option selected>---</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select>                       
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="text" class="form-control" placeholder="email">
                    </div>
                    <div class="col-sm-4">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="text" class="form-control" placeholder="senha" aria-label="uf" aria-describedby="basic-addon1">
                    </div>
                    <div class="col-sm-2">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="inputGroupSelect01">
                            <option selected>---</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select>       
                    </div>
            </div>
            <div class="d-flex justify-content-end py-3">
                <div class="">
                    <button class="btn btn-success" type="submit">Enviar</button>
                    <button class="btn btn-light" type="submit">Cancelar</button>
                </div>
            </div>
        </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
