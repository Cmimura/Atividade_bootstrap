<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabalho de Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    <body class="d-flex justify-content-center p-3">
        <form class="">
            <h3>Billing address</h3>
            <div class="mb-3">
                <div class="row g-3">
                    <div class="col">
                        <label for="firstname" class="form-label">First name</label>
                        <input type="text" class="form-control" placeholder="" aria-label="firstname" aria-describedby="basic-addon1">
                    </div>
                    <div class="col">
                        <label for="lastname" class="form-label">Last name</label>
                        <input type="text" class="form-control" placeholder="" aria-label="lastname" aria-describedby="basic-addon1">
                    </div>
                </div>
                </div>
            </div>
            <div class="col ">
                <label for="username" class="form-label">Username</label>
                <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon1">@</span>
                <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
            </div>
            <div class="col mb-3">
                <label for="email" class="form-label">Email <span class="text-muted">(Optional)</span></label>
                <input type="text" class="form-control" placeholder="you@example.com">
            </div>
            <div class="col mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" placeholder="1234 Main St">
            </div>
            <div class="col mb-3">
                <label for="address2" class="form-label">Address 2 <span class="text-muted">(Optional)</span></label>
                <input type="text" class="form-control" placeholder="Apartament or suit">
            </div>
            <div class="mb-3">
                <div class="row g-3">
                    <div class="col-5">
                        <label for="contry" class="form-label">Contry</label>
                        <select class="form-select" id="inputGroupSelect01">
                            <option selected>Choose...</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select> 
                    </div>
                    <div class="col-sm-4">
                        <label for="state" class="form-label">State</label>
                        <select class="form-select" id="inputGroupSelect01">
                            <option selected>Choose...</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select>                       
                    </div>
                    <div class="col-sm-3">
                        <label for="zip" class="form-label">zip</label>
                        <input type="text" class="form-control" placeholder="Zip" aria-label="Zip">                     
                    </div>
                </div>
            </div>
        </div>
        </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
