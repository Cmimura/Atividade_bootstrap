<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabalho de Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    <body class="d-flex justify-content-center p-3">
        <form class="">
            <div class="">
                <div class="row g-3">
                    <div class="col">
                        <label for="firstname" class="form-label">First name</label>
                        <input type="text" class="form-control" placeholder="Mark" aria-label="firstname" aria-describedby="basic-addon1">
                    </div>
                    <div class="col">
                        <label for="lastname" class="form-label">Last name</label>
                        <input type="text" class="form-control" placeholder="Otto" aria-label="lastname" aria-describedby="basic-addon1">
                    </div>
                    <div class="col">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1">@</span>
                        <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
                    </div>
                </div>
                </div>
            </div>
            <div class="">
                <div class="row g-3">
                    <div class="col-sm-7">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" placeholder="City" aria-label="City">
                    </div>
                    <div class="col-sm">
                        <label for="state" class="form-label">State</label>
                        <input type="text" class="form-control" placeholder="State" aria-label="State">
                    </div>
                    <div class="col-sm">
                        <label for="zip" class="form-label">zip</label>
                        <input type="text" class="form-control" placeholder="Zip" aria-label="Zip">
                    </div>
                </div>
            </div>
            <div class="d-flex py-2">
                <div class="form-check">
                <input class="form-check-input" type="checkbox" id="inlineFormCheck">
                <label class="form-check-label" for="inlineFormCheck">
                Agree to terms and conditions
                </label>
            </div>
        </div>
            <button class="btn btn-primary" type="submit">Submit form</button>
        </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
