<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabalho de Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    <body class="d-flex justify-content-center">
        <form class="">
            <h1 class="d-flex justify-content-center">Sample form</h1>
            <div class="d-flex justify-content-center">
                <div class="py-2">
                        <div class="">
                            <label for="partnername" class="pe-4">Partner Name</label>
                            <input type="text" class="me-4" aria-label="partnername" aria-describedby="basic-addon1">
                            <label for="partneremail" class="pe-4">Partner Email ID</label>
                            <input type="text" class="" placeholder="Otto" aria-label="partneremail" aria-describedby="basic-addon1">
                        </div>
                </div>
                </div>
            </div>
            <div class="d-flex justify-content-evenly">
                <div class="flex-grow-1">
                    <div class="flex-grow-1">
                        <label for="partnerlname" class="text-break pe-4">Partner Legal Name</label>
                        <input type="text" class="me-4" aria-label="partnerlname" aria-describedby="basic-addon1">
                        <label for="partnermobile" class="pe-4">Partner Mobile</label>
                        <input type="text" class="" placeholder="Otto" aria-label="partnermobile" aria-describedby="basic-addon1">
                    </div>
                </div>
            </div>
            <div class="d-flex py-4">
                <label for="partneraddress" class="pe-4">Partner Address</label>
                <textarea class="flex-grow-1" name="textarea" id="textarea"></textarea>
            </div>
            <div class="d-flex py-2">
                <div class="form-check">
                <input class="form-check-input" type="checkbox" id="inlineFormCheck">
                <label class="form-check-label" for="inlineFormCheck">
                Agree to terms and conditions
                </label>
            </div>
        </div>
            <button class="btn btn-primary" type="submit">Submit form</button>
        </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
