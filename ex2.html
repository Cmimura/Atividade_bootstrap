<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabalho de Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    <body class="d-flex justify-content-center p-3">
        <form class="">
            <div class="">
                <div class="">
                    <div class="row g-3">
                        <div class="col-sm-1">
                            <label for="codigo" class="form-label">Código</label>
                            <input type="number" class="form-control" placeholder="32">
                        </div>
                        <div class="col">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" placeholder="Nome Completo do Cliente" aria-label="lastname" aria-describedby="basic-addon1">
                        </div>
                        <div class="col">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="text" class="form-control" placeholder="cliente@dominio.com" aria-label="Username" aria-describedby="basic-addon1">
                        </div>
                        <div class="col-sm-2">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text" class="form-control" placeholder="Só números" aria-label="Username" aria-describedby="basic-addon1">
                        </div>
                    </div>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col">
                        <label for="celular" class="form-label">N° Celular</label>
                        <input type="text" class="form-control" placeholder="N° do celular" aria-label="City">
                    </div>
                    <div class="col-sm-2">
                        <label for="telefone" class="form-label">N° Telefone fixo</label>
                        <input type="text" class="form-control" placeholder="N° telefone" aria-label="State">
                    </div>
                    <div class="col-sm">
                        <label for="cep" class="form-label">CEP</label>
                        <input type="text" class="form-control" placeholder="ex:88308070" aria-label="Zip">
                    </div>
                    <div class="col-sm">
                        <label for="logradouro" class="form-label">Logradouro</label>
                        <input type="text" class="form-control" placeholder="ex:Rua 1400," aria-label="Zip">
                    </div>
                    <div class="col-sm-1">
                        <label for="num" class="form-label">N°</label>
                        <input type="number" class="form-control" placeholder="N°" aria-label="Zip">
                    </div>
                    <div class="col-sm">
                        <label for="bairro" class="form-label">Bairro</label>
                        <input type="text" class="form-control" placeholder="Bairro" aria-label="Zip">
                    </div>
                </div>
            </div>
            <div class="">
                <div class="row g-3">
                    <div class="col-sm-3">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" placeholder="cidade">
                    </div>
                    <div class="col-sm-1">
                        <label for="uf" class="form-label">UF</label>
                        <input type="text" class="form-control" placeholder="UF" aria-label="uf" aria-describedby="basic-addon1">
                    </div>
                    <div class="col-sm-2">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="inputGroupSelect01">
                            <option selected>Selecione</option>
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select>       
                    </div>
            </div>
            <div class="d-flex justify-content-end py-3">
                <div class="">
                    <button class="btn btn-danger" type="submit">Resetar</button>
                    <button class="btn btn-success" type="submit">Próximo</button>
                </div>
            </div>
        </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
